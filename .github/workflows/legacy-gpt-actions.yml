name: Legacy GPT Actions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  legacy-gpt-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: legacy-gpt-actions
      - name: Check legacy feature
        run: cargo check --locked -p webcodex --all-targets --features legacy-gpt-actions
      - name: Test frozen tool contracts
        run: cargo test --locked -p webcodex-tool-contracts --features legacy-gpt-actions
      - name: Test legacy server adapter
        run: cargo test --locked -p webcodex --lib --features legacy-gpt-actions
